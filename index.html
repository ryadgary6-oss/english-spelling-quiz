<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Spelling Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
    <span class="bulb">💡</span>
  </button>

  <main class="container">
    <section id="loginScreen" class="screen active">
      <h1 class="quiz-title">ENGLISH SPELLING QUIZ</h1>

      <form id="loginForm" class="login-form">
        <input
          type="text"
          id="studentName"
          placeholder="Full Name"
          required
        />
        <input
          type="text"
          id="studentNumber"
          placeholder="Student ID"
          required
        />
        <button type="submit" class="start-btn">START</button>
      </form>

      <p id="loginMessage" class="message"></p>
    </section>

    <section id="quizScreen" class="screen">
      <div class="quiz-header">
        <h2 id="questionCounter">Question 1 / 20</h2>
      </div>

      <div class="question-box">
        <p id="questionText" class="question-text"></p>
      </div>

      <div id="optionsContainer" class="options-container"></div>

      <div class="nav-buttons">
        <button id="prevBtn" class="nav-btn">Previous</button>
        <button id="nextBtn" class="nav-btn">Next</button>
      </div>

      <p id="quizMessage" class="message"></p>
    </section>

    <section id="resultScreen" class="screen">
      <h2 class="result-title">Quiz Finished</h2>
      <p id="finalScore" class="result-text"></p>
      <p id="finalPercentage" class="result-text"></p>
      <p id="funMessage" class="fun-message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
