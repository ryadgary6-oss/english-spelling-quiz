<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Spelling Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" type="button">
    <span class="bulb"></span>
  </button>

  <div id="timerDisplay" class="timer-display">00:00:00:00</div>

  <div class="container">
    <!-- LOGIN SCREEN -->
    <section id="loginScreen" class="screen active">
      <h1 class="quiz-title">ENGLISH SPELLING QUIZ</h1>

      <form id="loginForm" class="login-form" novalidate>
        <input
          type="text"
          id="studentName"
          name="studentName"
          placeholder="Enter your full name"
          autocomplete="name"
        />

        <input
          type="text"
          id="studentId"
          name="studentId"
          placeholder="Enter your student ID"
          inputmode="numeric"
          autocomplete="off"
        />

        <button id="startBtn" class="start-btn" type="button">START</button>

        <p id="loginMessage" class="message"></p>
        <p id="debugMessage" class="debug-message"></p>
      </form>
    </section>

    <!-- LOADING SCREEN -->
    <section id="loadingScreen" class="screen">
      <div class="loading-wrap">
        <div class="loading-ring"></div>
        <div class="loading-text">Loading</div>
      </div>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="quizScreen" class="screen">
      <div class="quiz-header">
        <div id="questionCounter" class="question-counter">1</div>
      </div>

      <div class="question-box">
        <p id="questionText" class="question-text"></p>
      </div>

      <div id="optionsContainer" class="options-container"></div>

      <div class="nav-buttons">
        <button id="prevBtn" class="circle-nav-btn" type="button" aria-label="Previous question">←</button>
        <button id="nextBtn" class="circle-nav-btn" type="button" aria-label="Next question">→</button>
      </div>

      <p id="quizMessage" class="message"></p>
    </section>

    <!-- RESULT SCREEN -->
    <section id="resultScreen" class="screen">
      <h2 class="result-title">QUIZ COMPLETED</h2>
      <p id="finalScore" class="result-text"></p>
      <p id="finalPercentage" class="result-text"></p>
      <p id="funMessage" class="fun-message"></p>
      <p id="finalTimer" class="final-timer"></p>
    </section>
  </div>

  <audio id="bgMusic" loop preload="auto"></audio>

  <script src="script.js?v=final-debug-2"></script>
</body>
</html>
